name: Test Eir

on:
  pull_request:
    branches: ["main"]
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test container
        run: docker build -t eir-api:ci-test ./api

      - name: Run container unit tests
        run: |
          set -euo pipefail
          tar -C ./api -cf - tests | docker run --rm -i --entrypoint sh -w /app \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/app \
            eir-api:ci-test -c 'tar -xf - -C /app && exec python -m tests -v'
