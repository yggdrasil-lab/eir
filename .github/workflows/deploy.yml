name: Deploy Eir

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Required Configuration
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_RAW_PASSWORD: ${{ secrets.REGISTRY_RAW_PASSWORD }}
          EIR_MCP_TOKEN: ${{ secrets.EIR_MCP_TOKEN }}
          EIR_WITHINGS_CLIENT_ID: ${{ secrets.EIR_WITHINGS_CLIENT_ID }}
          EIR_WITHINGS_CLIENT_SECRET: ${{ secrets.EIR_WITHINGS_CLIENT_SECRET }}
        run: |
          MISSING=""
          [ -z "$DOMAIN_NAME" ] && MISSING="${MISSING:+$MISSING }DOMAIN_NAME"
          [ -z "$REGISTRY_PREFIX" ] && MISSING="${MISSING:+$MISSING }REGISTRY_PREFIX"
          [ -z "$REGISTRY_USERNAME" ] && MISSING="${MISSING:+$MISSING }REGISTRY_USERNAME"
          [ -z "$REGISTRY_RAW_PASSWORD" ] && MISSING="${MISSING:+$MISSING }REGISTRY_RAW_PASSWORD"
          [ -z "$EIR_MCP_TOKEN" ] && MISSING="${MISSING:+$MISSING }EIR_MCP_TOKEN"
          [ -z "$EIR_WITHINGS_CLIENT_ID" ] && MISSING="${MISSING:+$MISSING }EIR_WITHINGS_CLIENT_ID"
          [ -z "$EIR_WITHINGS_CLIENT_SECRET" ] && MISSING="${MISSING:+$MISSING }EIR_WITHINGS_CLIENT_SECRET"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required configuration: $MISSING" >&2
            exit 1
          fi

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.${{ vars.DOMAIN_NAME }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_RAW_PASSWORD }}

      - name: Setup Secrets
        env:
          EIR_MCP_TOKEN: ${{ secrets.EIR_MCP_TOKEN }}
        run: |
          if [ -z "${EIR_MCP_TOKEN}" ]; then
            echo "Error: EIR_MCP_TOKEN secret is required" >&2
            exit 1
          fi
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          echo "EIR_MCP_TOKEN_NAME=$(echo "$EIR_MCP_TOKEN" | /tmp/ensure_secret.sh eir_mcp_token)" >> $GITHUB_ENV

      - name: Prepare host data directory
        env:
          EIR_DB_MOUNT_PATH: ${{ vars.EIR_DB_MOUNT_PATH || '/opt/eir/data' }}
        run: |
          docker run --rm -v "${EIR_DB_MOUNT_PATH}":/data alpine mkdir -p /data

      - name: Run Container Unit Tests
        run: |
          set -euo pipefail
          trap 'docker rmi -f eir-api:ci-test >/dev/null 2>&1 || true' EXIT
          docker build -t eir-api:ci-test ./api
          tar -C ./api -cf - tests | docker run --rm -i --entrypoint sh -w /app \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/app \
            eir-api:ci-test -c 'tar -xf - -C /app && exec python -m tests -v'

      - name: Build and Deploy with Docker Compose
        env:
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          EIR_DB_MOUNT_PATH: ${{ vars.EIR_DB_MOUNT_PATH || '/opt/eir/data' }}
          EIR_WITHINGS_CLIENT_ID: ${{ secrets.EIR_WITHINGS_CLIENT_ID }}
          EIR_WITHINGS_CLIENT_SECRET: ${{ secrets.EIR_WITHINGS_CLIENT_SECRET }}
          EIR_WITHINGS_REDIRECT_URI: https://eir.${{ vars.DOMAIN_NAME }}/integrations/withings/callback
          IMAGE_TAG: eir
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "eir" docker-compose.yml

      - name: Verify Post-Deploy Swarm Convergence
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/verify_convergence.sh -o /tmp/verify_convergence.sh
          chmod +x /tmp/verify_convergence.sh
          /tmp/verify_convergence.sh "eir" eir_eir-api eir_eir-db
