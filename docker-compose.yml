services:
  eir-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=eir
      - POSTGRES_DB=eir
      - POSTGRES_PASSWORD=eir
      - TZ=Pacific/Auckland
    volumes:
      - ${EIR_DB_MOUNT_PATH}:/var/lib/postgresql/data
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eir -d eir"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  eir-api:
    image: ${REGISTRY_PREFIX}eir-api:${IMAGE_TAG}
    build: ./api
    environment:
      - EIR_DATABASE_URL=postgresql+psycopg://eir:eir@eir-db:5432/eir
      - EIR_ENVIRONMENT=production
      - EIR_MCP_TOKEN_FILE=/run/secrets/eir_mcp_token
      - TZ=Pacific/Auckland
    secrets:
      - eir_mcp_token
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        # Authentik SSO for web/browser API requests under /api/*
        - "traefik.http.routers.eir-api.rule=Host(`eir.${DOMAIN_NAME}`) && PathPrefix(`/api`)"
        - "traefik.http.routers.eir-api.entrypoints=websecure"
        - "traefik.http.routers.eir-api.tls=true"
        - "traefik.http.routers.eir-api.tls.certresolver=cloudflare"
        - "traefik.http.routers.eir-api.middlewares=authentik@docker,eir-api-strip"
        - "traefik.http.middlewares.eir-api-strip.stripprefix.prefixes=/api"
        # Machine-to-machine integrations endpoint (Withings webhooks, Apple Health shortcuts)
        - "traefik.http.routers.eir-integrations.rule=Host(`eir.${DOMAIN_NAME}`) && PathPrefix(`/integrations`)"
        - "traefik.http.routers.eir-integrations.entrypoints=websecure"
        - "traefik.http.routers.eir-integrations.tls=true"
        - "traefik.http.routers.eir-integrations.tls.certresolver=cloudflare"
        - "traefik.http.routers.eir-integrations.service=eir-api"
        # Machine-to-machine MCP endpoint for Hermes Agent and Antigravity
        - "traefik.http.routers.eir-mcp.rule=Host(`eir.${DOMAIN_NAME}`) && PathPrefix(`/mcp`)"
        - "traefik.http.routers.eir-mcp.entrypoints=websecure"
        - "traefik.http.routers.eir-mcp.tls=true"
        - "traefik.http.routers.eir-mcp.tls.certresolver=cloudflare"
        - "traefik.http.routers.eir-mcp.service=eir-api"
        - "traefik.http.services.eir-api.loadbalancer.server.port=8000"
        - "traefik.docker.network=aether-net"

secrets:
  eir_mcp_token:
    external: true
    name: ${EIR_MCP_TOKEN_NAME}

networks:
  aether-net:
    external: true
